<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Neurotransmitter Simulation</title>
    <style>
      body {
        margin: 0;
        overflow: hidden;
        background-color: #1a1a1a;
        color: #ffffff;
        font-family: Arial, sans-serif;
      }
      #info {
        position: absolute;
        top: 10px;
        width: 100%;
        text-align: center;
        z-index: 100;
        pointer-events: none;
      }
      .controls {
        position: absolute;
        bottom: 20px;
        width: 100%;
        text-align: center;
        z-index: 100;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 10px;
      }
      .controls > div {
        display: flex;
        gap: 5px;
        flex-wrap: wrap;
        justify-content: center;
      }
      button,
      select {
        background: #333;
        color: #fff;
        border: 1px solid #444;
        padding: 8px 15px;
        border-radius: 4px;
        margin: 0 5px;
        cursor: pointer;
        transition: all 0.3s;
      }
      button:hover {
        background: #444;
        transform: translateY(-2px);
        box-shadow: 0 4px 8px rgba(0,0,0,0.3);
      }
      #viewBtn {
        font-size: 16px;
        padding: 10px 20px;
        border: 2px solid #6688ff;
      }
      #inhibitBtn {
        margin-top: 10px;
        padding: 10px 20px;
        transition: background-color 0.3s;
      }
      #inhibitBtn:hover {
        background: #444;
      }
      .info-panel {
        position: absolute;
        top: 80px;
        right: 20px;
        background: rgba(0, 0, 0, 0.7);
        padding: 15px;
        border-radius: 5px;
        max-width: 250px;
      }
      #effects {
        font-size: 14px;
        line-height: 1.4;
      }
    </style>
  </head>
  <body>
    <div id="info">
      <h2>Neurotransmitter Simulation</h2>
      <p>Blue: Excitatory | Green: Inhibitory</p>
    </div>

    <div class="controls">
      <div>
        <!-- View button will be inserted here by JavaScript -->
        <!-- Tutorial button will be inserted here by JavaScript -->
      </div>
      <div>
        <select id="ntType">
          <option value="DOPAMINE">Dopamine (Reward)</option>
          <option value="SEROTONIN">Serotonin (Mood)</option>
          <option value="GLUTAMATE">Glutamate (Excitatory)</option>
          <option value="GABA">GABA (Inhibitory)</option>
          <option value="NOREPINEPHRINE">Norepinephrine (Arousal)</option>
        </select>
        <button type="button" id="releaseBtn">🚀 Release Neurotransmitters</button>
        <button type="button" id="resetBtn">🔄 Reset</button>
      </div>
    </div>
    <div class="info-panel" id="emotionalFace">
      <h3>Current Effects:</h3>
      <div id="effects"></div>
    </div>

    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
        }
      }
    </script>
    <script type="module" src="simulation.js"></script>
  </body>
</html>
