<!DOCTYPE html>
<html>
<head>
    <title>Neurotransmitter Simulation</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #000;
            color: white;
            font-family: Arial, sans-serif;
        }
        .controls {
            position: absolute;
            top: 10px;
            left: 10px;
            z-index: 100;
            background: rgba(0, 0, 0, 0.7);
            padding: 10px;
            border-radius: 5px;
        }
        button {
            margin: 5px;
            padding: 8px 15px;
            background: #333;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover {
            background: #444;
        }
        select {
            margin: 5px;
            padding: 5px;
            background: #333;
            color: white;
            border: none;
            border-radius: 4px;
        }
        #effects {
            position: absolute;
            bottom: 10px;
            left: 10px;
            background: rgba(0, 0, 0, 0.7);
            padding: 10px;
            border-radius: 5px;
            max-width: 300px;
        }
        #canvas-container {
            width: 100vw;
            height: 100vh;
        }
    </style>
</head>
<body>
    <div class="controls">
        <button id="releaseBtn">Release Neurotransmitters</button>
        <button id="resetBtn">Reset</button>
        <select id="ntType">
            <option value="DOPAMINE">Dopamine</option>
            <option value="SEROTONIN">Serotonin</option>
            <option value="GLUTAMATE">Glutamate</option>
            <option value="GABA">GABA</option>
            <option value="NOREPINEPHRINE">Norepinephrine</option>
        </select>
    </div>
    <div id="effects"></div>
    <div id="canvas-container"></div>

    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.159.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.159.0/examples/jsm/"
        }
    }
    </script>

    <!-- Import our modules -->
    <script type="module" src="emotionalFace.js"></script>
    <script type="module" src="neurotransmitter.js"></script>
    <script type="module" src="storageVesicle.js"></script>
    <script type="module" src="simulation.js"></script>
</body>
</html>
